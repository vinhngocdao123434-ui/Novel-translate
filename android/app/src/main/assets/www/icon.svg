<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="droidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="24 12" />

  <!-- Droid Antennae -->
  <line x1="184" y1="102" x2="133" y2="51" stroke="#34d399" stroke-width="18" stroke-linecap="round" />
  <circle cx="128" cy="46" r="10" fill="#34d399" />
  <line x1="328" y1="102" x2="379" y2="51" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />
  <circle cx="384" cy="46" r="10" fill="#38bdf8" />

  <!-- Android Robot Head Dome -->
  <path d="M133 205 C133 133, 379 133, 379 205 Z" fill="url(#droidGrad)" filter="url(#glow)" />

  <!-- Android Glowing Eyes -->
  <circle cx="205" cy="169" r="14" fill="#ffffff" />
  <circle cx="307" cy="169" r="14" fill="#ffffff" />

  <!-- Open Novel Book Base -->
  <path d="M82 276 C164 251, 246 266, 256 307 C266 266, 348 251, 430 276 L420 399 C338 374, 266 389, 256 420 C246 389, 174 374, 92 399 Z" fill="url(#bookGrad)" opacity="0.95" />
  <line x1="256" y1="307" x2="256" y2="420" stroke="#090d16" stroke-width="10" />

  <!-- Book Pages Highlight -->
  <path d="M112 292 C174 271, 235 281, 246 317 L246 389 C174 358, 123 363, 112 379 Z" fill="#ffffff" opacity="0.15" />
  <path d="M400 292 C338 271, 277 281, 266 317 L266 389 C338 358, 389 363, 400 379 Z" fill="#ffffff" opacity="0.15" />

  <!-- Translation Neural Connection Waves -->
  <path d="M164 241 Q256 210 348 241" stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="20 16" />
  <circle cx="256" cy="225" r="16" fill="#fbbf24" filter="url(#glow)" />
</svg>
